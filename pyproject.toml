[project]
name = "copilot"
version = "0.0.0"
description = "Career copilot monorepo (workspace root, not a package)"
requires-python = ">=3.12,<3.13"
# The root depends on every member so a plain `uv sync` installs the whole workspace.
dependencies = [
  "copilot-api",
  "copilot-core",
  "copilot-gateway",
  "copilot-protocol",
  "copilot-worker",
]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.30",
  "boto3>=1.40",
  "boto3-stubs[sqs]>=1.40",
  "datamodel-code-generator[ruff]>=0.34",
  "httpx2>=2.13.1",
  "jsonschema[format-nongpl]>=4.23",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "valkey>=6.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/gateway", "apps/worker", "packages/core", "packages/protocol"]

[tool.uv.sources]
copilot-api = { workspace = true }
copilot-core = { workspace = true }
copilot-gateway = { workspace = true }
copilot-protocol = { workspace = true }
copilot-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/protocol/python/copilot_protocol/models.py", "apps/desktop", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["copilot_api", "copilot_core", "copilot_gateway", "copilot_protocol", "copilot_worker"]

[tool.pyright]
include = ["apps/api", "apps/gateway", "apps/worker", "packages/core", "packages/protocol", "migrations", "scripts", "tests"]
exclude = ["**/node_modules", "**/.venv", "apps/desktop"]
pythonVersion = "3.12"
# Strict for shipped code; standard for tests, scripts and the generated models.
typeCheckingMode = "standard"
strict = ["apps/api/src", "apps/gateway/src", "apps/worker/src", "packages/core/src", "packages/protocol/python/copilot_protocol/audio.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "apps/gateway/tests",
  "apps/worker/tests",
  "packages/core/tests",
  "packages/protocol/tests",
  "migrations/tests",
  "tests",
]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["stack: needs the docker compose stack (Postgres, Valkey, ElasticMQ)"]
