[project]
name = "copilot-protocol"
version = "0.0.0"
description = "Realtime protocol types, generated from protocol.schema.json"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"
