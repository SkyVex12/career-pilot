# Native Mac validation and DMGs run manually or for signed releases to conserve Actions minutes.
name: desktop-macos
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Publish a verified Universal preview run whose source commit is now on main (optional)
        type: string
        default: ""
        required: false
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    name: macOS (Universal)
    if: inputs.source_run_id == ''
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
      # Smaller native dependency caches and faster test links; installer optimization is unchanged.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      VERSION: ${{ inputs.version || '0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-macos-universal
          # Only main builds update the shared dependency cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Frontend and packaging tests
        run: pnpm --filter @copilot/desktop test
      - name: Check native bridge syntax and macOS 13 availability
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          for arch in arm64 x86_64; do
            xcrun clang -fsyntax-only -fobjc-arc -fblocks -arch "$arch" \
              -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
              -Werror=unguarded-availability -isysroot "$sdk" \
              apps/desktop/core/native/audio.m \
              apps/desktop/src-tauri/native/screen.m \
              apps/desktop/src-tauri/native/capture_mask.m
          done
      - name: Native Rust tests (also compiles the Apple bridges)
        run: cargo test -p copilot-client -p copilot-desktop --lib --locked
      - name: Configure bundle and updater
        working-directory: apps/desktop
        env:
          RELEASE: ${{ inputs.version != '' }}
        run: |
          preview=()
          if [ "$RELEASE" != true ]; then preview=(--preview); fi
          node scripts/release.mjs config --version "$VERSION" --platform darwin-universal "${preview[@]}"
      - name: Check release signing credentials
        if: inputs.version != ''
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for key in CERT IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID UPDATER_KEY; do
            [ -n "${!key}" ] || { echo "::error::Missing Mac release credential: $key"; exit 1; }
          done
      - name: Build app and DMG
        working-directory: apps/desktop
        env:
          RELEASE: ${{ inputs.version != '' }}
          APPLE_CERTIFICATE: ${{ inputs.version != '' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.version != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.version != '' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.version != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.version != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.version != '' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.version != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.version != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "$RELEASE" != true ]; then
            # Tauri treats present-but-empty credentials as signing/notarization requests.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          pnpm tauri build --target universal-apple-darwin --features release --config src-tauri/tauri.release.conf.json
      - name: Verify the Universal app inside the DMG
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          dmgs=(../../target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one Universal DMG"; exit 1; }
          mount="$RUNNER_TEMP/copilot-universal-dmg"
          mkdir -p "$mount" ../../dist-preview
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet' EXIT
          codesign --verify --deep --strict "$mount/Copilot Desktop.app"
          node scripts/macos-bundle.mjs verify --app "$mount/Copilot Desktop.app" \
            --dmg "${dmgs[0]}" --sha "$(git rev-parse HEAD)" --out ../../dist-preview/verification.json
          cp "${dmgs[0]}" ../../dist-preview/
          hdiutil detach "$mount" -quiet
          trap - EXIT
      - name: Package release files
        if: inputs.version != ''
        working-directory: apps/desktop
        run: |
          node scripts/release.mjs manifest --version "$VERSION" --platform darwin-universal --bundle-dir ../../target/universal-apple-darwin/release/bundle/macos --out ../../dist-release
          mv ../../dist-release/latest.json ../../dist-release/manifest-darwin-universal.json
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: desktop-macos-universal-${{ env.VERSION }}
          path: dist-release
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: preview
        if: inputs.version == ''
        with:
          name: desktop-macos-preview-universal
          path: dist-preview
          if-no-files-found: error
          retention-days: 14
      - name: Preview download instructions
        if: inputs.version == ''
        env:
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo "### Universal Mac preview (Apple Silicon and Intel)"
            echo
            echo "[Download the DMG artifact]($ARTIFACT_URL), unzip it, and open the DMG."
            echo
            echo "Built from commit $GITHUB_SHA. Requires macOS 13 or newer."
            echo "This is an ad-hoc signed test build, not a notarized public release."
            echo "Stealth is experimental: test the received screen share from another meeting participant."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-preview:
    name: publish Mac preview downloads
    needs: build
    # Only main may publish; a manually built branch artifact is reusable after its exact commit reaches main.
    # The GCP identity provider also restricts the repository and main ref.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.version == '' &&
      github.ref == 'refs/heads/main' && github.event.repository.fork == false &&
      (needs.build.result == 'success' ||
       (inputs.source_run_id != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: desktop-macos-preview-publish
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
      BUCKET: ${{ vars.GCP_RELEASES_BUCKET }}
      RELEASE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main source and publication settings
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Preview publication requires main"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::Preview source is not on main"; exit 1; }
          for key in BUCKET RELEASE_ACCOUNT IDENTITY_PROVIDER; do
            [ -n "${!key}" ] || { echo "::error::Missing preview publication setting: $key"; exit 1; }
          done
      - name: Verify source run and Universal artifact
        id: source
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const rawRunId = process.env.SOURCE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(rawRunId) || !Number.isSafeInteger(Number(rawRunId))) {
              throw new Error('source_run_id must be a positive numeric Actions run ID');
            }
            const runId = Number(rawRunId);
            const expectedRepo = context.repo.owner + '/' + context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
            if (run.repository.full_name !== expectedRepo || run.head_repository?.full_name !== expectedRepo ||
                run.path !== '.github/workflows/desktop-macos.yml' ||
                run.event !== 'workflow_dispatch' || !/^[0-9a-f]{40}$/.test(run.head_sha) ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
              throw new Error('Preview source must be a manually dispatched desktop-macos workflow in this repository');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: runId, filter: 'all', per_page: 100,
            });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: runId, per_page: 100,
            });
            // Skipped build jobs from publisher-only retries do not replace the successful build.
            const matches = jobs.filter(job => job.name === 'macOS (Universal)' && job.conclusion !== 'skipped')
              .sort((a, b) => b.id - a.id);
            if (matches.length === 0 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
              throw new Error('Source run has no successful Universal build');
            }
            const matchingArtifacts = artifacts.filter(artifact =>
              artifact.name === 'desktop-macos-preview-universal' && !artifact.expired);
            if (matchingArtifacts.length !== 1 || matchingArtifacts[0].size_in_bytes <= 0 ||
                matchingArtifacts[0].workflow_run?.id !== runId ||
                matchingArtifacts[0].workflow_run?.head_sha !== run.head_sha) {
              throw new Error('Source run has no unexpired Universal preview artifact for its commit');
            }
            core.setOutput('run_id', String(runId));
            core.setOutput('sha', run.head_sha);
            core.setOutput('attempt', String(run.run_attempt));
      - name: Verify artifact source is on main
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main ||
            { echo "::error::Artifact source commit is not on main"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-preview-universal
          path: dist-preview
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Universal preview receipt and DMG hash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node apps/desktop/scripts/macos-bundle.mjs preview \
            --artifacts dist-preview --sha "$SOURCE_SHA" --out publish-preview
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish preview downloads
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: |
          base="gs://$BUCKET/desktop/previews"
          source="$SOURCE_SHA/$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          for dmg in publish-preview/Copilot-*.dmg; do
            gcloud storage cp --cache-control="public, max-age=31536000, immutable" \
              "$dmg" "$base/$source/$(basename "$dmg")"
          done
          for dmg in publish-preview/Copilot-*.dmg; do
            name=$(basename "$dmg")
            gcloud storage cp --cache-control="no-cache, max-age=0" "$dmg" "$base/$name"
            {
              echo "- [Download $name](https://storage.googleapis.com/$BUCKET/desktop/previews/$name)"
              echo "  ([this build](https://storage.googleapis.com/$BUCKET/desktop/previews/$source/$name))"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "Universal macOS 13+ preview from commit $SOURCE_SHA (Apple Silicon and Intel); ad-hoc signed, not notarized."
            echo "The signed updater manifest and release download links are unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
