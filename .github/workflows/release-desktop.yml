# The desktop installer (README.md, "Releasing the desktop app"). Release and recovery entries:
#
# - After every deploy of main (deploy.yml calls this workflow once the backend deploy passed):
#   the plan job (scripts/desktop_release.py) releases the next patch version only if the merge
#   changed something the app ships since the last desktop-v* tag, and skips otherwise. The
#   desktop-v<version> tag is pushed after the publish. (A tag pushed with GITHUB_TOKEN starts
#   no workflow, which is why deploy.yml calls this one instead of relying on the tag.)
# - A tag desktop-v<version> pushed by hand on a commit on main (minor and major versions):
#   always a release, with that version.
# - One-time manual repair of the missing 0.3.1 and 0.3.2 tags; no build or upload.
#
# The Windows runner builds the NSIS installer with that version, pointed at the stage in
# apps/desktop/release.json, with the updater signature (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD). The publish job puts it in the public releases bucket,
# latest.json last and never over a newer one; installed apps find it at their next check
# (at start and every four hours) and install it when no call is running.
#
# Windows code signing is off until there is a certificate: set the repository variable
# AZURE_SIGNING_ACCOUNT (and its secrets, below) for Azure Trusted Signing, or
# WINDOWS_SIGN_COMMAND for any other signer (README.md, "Code signing").
name: release-desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      repair_published_tags:
        description: "Repair only the missing tags for already-published 0.3.1 and 0.3.2 (no builds)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sha:
        description: The commit on main that deploy.yml just deployed
        type: string
        required: true

permissions:
  contents: read

# No workflow-level concurrency: deploy.yml holds the group `release-desktop` around the call
# (a group here would wait on itself). Publishes are one at a time (the publish job).

jobs:
  repair-published-tags:
    name: repair the published 0.3.1 and 0.3.2 tags
    if: github.event_name == 'workflow_dispatch' && inputs.repair_published_tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-desktop-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the two known publications and restore their tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          # Deliberately fixed: this repair accepts no run, version, commit, or tag inputs.
          releases = (
              (44532286197, "0.3.1", "076c06314dd93301a058d7fa66ef7ddb3506232c"),
              (44535284347, "0.3.2", "df6b4f08f403ab2cb259baa62dac78de68b283a4"),
          )
          repo = "SkyVex12/career-pilot"
          bucket = "copilot-stage0-releases-career-pilot-512115"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def api(path, paged=False):
              args = ["gh", "api"]
              if paged:
                  args += ["--paginate", "--slurp"]
              return json.loads(subprocess.check_output([*args, path], text=True))

          require(os.environ["REPOSITORY"] == repo, "Repair is restricted to the original repository")
          missing = []
          summary_lines = []
          for run_id, version, sha in releases:
              base = f"repos/{repo}/actions/runs/{run_id}"
              run = api(base)
              require(run.get("id") == run_id and run.get("repository", {}).get("full_name") == repo, f"Run {run_id}: wrong repository")
              require(run.get("path") == ".github/workflows/deploy.yml", f"Run {run_id}: unexpected workflow")
              require(run.get("event") == "push" and run.get("head_branch") == "main" and run.get("head_sha") == sha, f"Run {run_id}: unexpected source commit")
              require(run.get("status") == "completed" and run.get("conclusion") == "success", f"Run {run_id}: not successfully completed")
              git("merge-base", "--is-ancestor", sha, "origin/main")
              jobs = [job for page in api(base + "/jobs?per_page=100", paged=True) for job in page["jobs"]]
              require(any(job.get("name") == "desktop / publish to the releases bucket" and job.get("status") == "completed" and job.get("conclusion") == "success" for job in jobs), f"Run {run_id}: no successful publication job")
              artifacts = [artifact for page in api(base + "/artifacts?per_page=100", paged=True) for artifact in page["artifacts"]]
              installers = [artifact for artifact in artifacts if artifact.get("name") == f"desktop-{version}"]
              require(len(installers) == 1, f"Run {run_id}: expected exactly one desktop-{version} artifact")
              origin = installers[0].get("workflow_run") or {}
              require(origin.get("id") == run_id and origin.get("head_sha") == sha and origin.get("repository_id") == run["repository"]["id"], f"Run {run_id}: artifact source does not match")
              url = f"https://storage.googleapis.com/{bucket}/desktop/{version}/Copilot-Desktop_{version}_x64-setup.exe"
              for public_url in (url, url + ".sig"):
                  with urllib.request.urlopen(urllib.request.Request(public_url, method="HEAD"), timeout=20) as response:
                      require(response.status == 200 and response.geturl() == public_url and int(response.headers.get("Content-Length", "0")) > 0, f"Run {run_id}: published installer or signature is missing")
              tag = f"desktop-v{version}"
              tag_ref = f"refs/tags/{tag}"
              if git("ls-remote", "--tags", "origin", tag_ref):
                  git("fetch", "--no-tags", "origin", tag_ref)
                  existing = git("rev-parse", "--verify", "FETCH_HEAD^{commit}")
                  require(existing == sha, f"{tag} already points at {existing}, not published commit {sha}")
                  state = "already present"
              else:
                  missing.append(f"{sha}:{tag_ref}")
                  state = "restored"
              summary_lines.append(f"- `{tag}` {state} at `{sha}` from successful run {run_id}")

          # Both publications and every existing tag must pass before any remote tag changes.
          if missing:
              git("push", "--atomic", "origin", *missing)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              for line in summary_lines:
                  print(line)
                  summary.write(line + "\n")
          PY

  plan:
    name: plan (release or skip, version, notes)
    # Reusable workflows retain their caller's event, including normal manual deploys.
    if: ${{ !inputs.repair_published_tags }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # every tag and the merges since the last one
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - id: plan
        name: Plan
        env:
          SHA: ${{ inputs.sha || github.sha }}
          # Set for a tag pushed by hand; empty when deploy.yml calls (its ref is main).
          TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
        run: |
          uv run --no-project python scripts/desktop_release.py plan --sha "$SHA" --tag "$TAG" --published --github-output
      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          if [ "$RELEASE" = true ]; then
            { echo "### Desktop $VERSION: releasing"; echo; echo "$REASON"; echo; echo '```'; echo "$NOTES"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### Desktop: no release"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: installer (Windows)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ needs.plan.outputs.version }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: The updater's signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set (README.md, \"Releasing the desktop app\")"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - run: pnpm install --frozen-lockfile

      # --- Code signing (a drop-in; off until configured) -----------------------------------
      # Azure Trusted Signing: an Azure account, a Trusted Signing account and certificate
      # profile, and an app registration with the "Trusted Signing Certificate Profile Signer"
      # role. Variables AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_ENDPOINT;
      # secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID.
      - name: Azure Trusted Signing
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          echo "WINDOWS_SIGN_COMMAND=trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d Copilot %1" >> "$GITHUB_ENV"
      - name: Another signer
        if: vars.AZURE_SIGNING_ACCOUNT == '' && vars.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        run: echo "WINDOWS_SIGN_COMMAND=${{ vars.WINDOWS_SIGN_COMMAND }}" >> "$GITHUB_ENV"

      - name: Release config (version, updater, signing)
        working-directory: apps/desktop
        run: node scripts/release.mjs config --version ${{ needs.plan.outputs.version }}
      - name: Build the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: pnpm tauri build --features release --config src-tauri/tauri.release.conf.json
      - name: Release files and the update manifest
        working-directory: apps/desktop
        env:
          COPILOT_RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
        run: node scripts/release.mjs manifest --version ${{ needs.plan.outputs.version }} --out ../../dist-release
      - name: Signed for Windows?
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist-release/Copilot-setup.exe
          "Authenticode: $($sig.Status) $($sig.SignerCertificate.Subject)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.plan.outputs.version }}
          path: dist-release
          if-no-files-found: error

  macos:
    name: installers (macOS)
    needs: plan
    if: needs.plan.outputs.release == 'true' && vars.MACOS_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/desktop-macos.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  publish:
    name: publish to the releases bucket
    needs: [plan, build, macos]
    if: >-
      always() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time, whether from a merge or a tag pushed by hand.
    concurrency:
      group: release-desktop-publish
      cancel-in-progress: false
    permissions:
      contents: write # tag the published commit using GITHUB_TOKEN; starts no other workflow
      id-token: write # Workload Identity Federation into the release account: no stored key
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      BUCKET: ${{ vars.GCP_RELEASES_BUCKET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::$SHA is not on main; tag a commit on main"; exit 1; }
      - name: The repository variables are set
        run: |
          [ -n "$BUCKET" ] && [ -n "${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}" ] ||
            { echo "::error::set GCP_RELEASES_BUCKET and GCP_RELEASE_SERVICE_ACCOUNT (terraform output ci)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ needs.plan.outputs.version }}
          path: dist-release
      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          pattern: desktop-macos-*-${{ needs.plan.outputs.version }}
          path: dist-release
          merge-multiple: true
      - uses: actions/setup-node@v5
        if: needs.macos.result == 'success'
        with:
          node-version: 22
      - name: Merge Windows and Mac updater entries
        if: needs.macos.result == 'success'
        run: |
          node apps/desktop/scripts/release.mjs merge --version "$VERSION" --out dist-release/latest.json dist-release/latest.json dist-release/manifest-darwin-aarch64.json dist-release/manifest-darwin-x86_64.json
      - name: The manifest points at this bucket
        run: |
          url=$(jq -r '.platforms["windows-x86_64"].url' dist-release/latest.json)
          case "$url" in
            "https://storage.googleapis.com/$BUCKET/desktop/$VERSION/"*) echo "installer url: $url" ;;
            *) echo "::error::latest.json points at $url, not this bucket: run stage.py desktop-config"; exit 1 ;;
          esac
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - name: Never over a newer release
        run: |
          live=$(curl -fsS "https://storage.googleapis.com/$BUCKET/desktop/latest.json" | jq -r .version) || live=""
          if [ -n "$live" ] && uv run --no-project python scripts/desktop_release.py newer "$live" "$VERSION"; then
            echo "::error::the bucket already has $live, newer than $VERSION; tag a higher version"; exit 1
          fi
          echo "published now: ${live:-none}; publishing $VERSION"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Upload (the versioned installer, then the download link, then latest.json)
        id: upload
        run: |
          base="gs://$BUCKET/desktop"
          gcloud storage cp --cache-control="public, max-age=31536000, immutable"             "dist-release/$VERSION/"* "$base/$VERSION/"
          gcloud storage cp --cache-control="no-cache, max-age=0" dist-release/Copilot-setup.exe "$base/Copilot-setup.exe"
          for dmg in dist-release/Copilot-*.dmg; do
            [ -f "$dmg" ] || continue
            gcloud storage cp --cache-control="no-cache, max-age=0" "$dmg" "$base/$(basename "$dmg")"
          done
          gcloud storage cp --cache-control="no-cache, max-age=0" dist-release/latest.json "$base/latest.json"
      # Tag in this job: a separate downstream job can inherit the optional Mac job's skip.
      - name: Tag the published commit
        if: success() && needs.plan.outputs.create_tag == 'true' && steps.upload.outcome == 'success'
        env:
          TAG: desktop-v${{ needs.plan.outputs.version }}
        run: |
          tag_ref="refs/tags/$TAG"
          target=$(git rev-parse --verify "$SHA^{commit}")
          remote=$(git ls-remote --tags origin "$tag_ref")
          if [ -n "$remote" ]; then
            git fetch --no-tags origin "$tag_ref"
            existing=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            if [ "$existing" != "$target" ]; then
              echo "::error::$TAG already points at $existing, not published commit $target"
              exit 1
            fi
            echo "Tag \`$TAG\` already points at \`$target\`." >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "$target:$tag_ref"
            echo "Tagged \`$target\` as \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summary
        run: |
          {
            echo "### Copilot desktop $VERSION published"
            echo ""
            echo "- Download: https://storage.googleapis.com/$BUCKET/desktop/Copilot-setup.exe"
            echo "- Update manifest: https://storage.googleapis.com/$BUCKET/desktop/latest.json"
            echo "- Installed apps find it at their next check (at start, then every four hours) and install it when no call is running."
          } >> "$GITHUB_STEP_SUMMARY"
