# The desktop installer (README.md, "Releasing the desktop app"). Two ways in:
#
# - After every deploy of main (deploy.yml calls this workflow once the backend deploy passed):
#   the plan job (scripts/desktop_release.py) releases the next patch version only if the merge
#   changed something the app ships since the last desktop-v* tag, and skips otherwise. The
#   desktop-v<version> tag is pushed after the publish. (A tag pushed with GITHUB_TOKEN starts
#   no workflow, which is why deploy.yml calls this one instead of relying on the tag.)
# - A tag desktop-v<version> pushed by hand on a commit on main (minor and major versions):
#   always a release, with that version.
#
# The Windows runner builds the NSIS installer with that version, pointed at the stage in
# apps/desktop/release.json, with the updater signature (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD). The publish job puts it in the public releases bucket,
# latest.json last and never over a newer one; installed apps find it at their next check
# (at start and every four hours) and install it when no call is running.
#
# Windows code signing is off until there is a certificate: set the repository variable
# AZURE_SIGNING_ACCOUNT (and its secrets, below) for Azure Trusted Signing, or
# WINDOWS_SIGN_COMMAND for any other signer (README.md, "Code signing").
name: release-desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_call:
    inputs:
      sha:
        description: The commit on main that deploy.yml just deployed
        type: string
        required: true

permissions:
  contents: read

# No workflow-level concurrency: deploy.yml holds the group `release-desktop` around the call
# (a group here would wait on itself). Publishes are one at a time (the publish job).

jobs:
  plan:
    name: plan (release or skip, version, notes)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # every tag and the merges since the last one
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - id: plan
        name: Plan
        env:
          SHA: ${{ inputs.sha || github.sha }}
          # Set for a tag pushed by hand; empty when deploy.yml calls (its ref is main).
          TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
        run: |
          uv run --no-project python scripts/desktop_release.py plan --sha "$SHA" --tag "$TAG" --published --github-output
      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          if [ "$RELEASE" = true ]; then
            { echo "### Desktop $VERSION: releasing"; echo; echo "$REASON"; echo; echo '```'; echo "$NOTES"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### Desktop: no release"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: installer (Windows)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ needs.plan.outputs.version }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: The updater's signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set (README.md, \"Releasing the desktop app\")"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - run: pnpm install --frozen-lockfile

      # --- Code signing (a drop-in; off until configured) -----------------------------------
      # Azure Trusted Signing: an Azure account, a Trusted Signing account and certificate
      # profile, and an app registration with the "Trusted Signing Certificate Profile Signer"
      # role. Variables AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_ENDPOINT;
      # secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID.
      - name: Azure Trusted Signing
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          echo "WINDOWS_SIGN_COMMAND=trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d Copilot %1" >> "$GITHUB_ENV"
      - name: Another signer
        if: vars.AZURE_SIGNING_ACCOUNT == '' && vars.WINDOWS_SIGN_COMMAND != ''
        shell: bash
        run: echo "WINDOWS_SIGN_COMMAND=${{ vars.WINDOWS_SIGN_COMMAND }}" >> "$GITHUB_ENV"

      - name: Release config (version, updater, signing)
        working-directory: apps/desktop
        run: node scripts/release.mjs config --version ${{ needs.plan.outputs.version }}
      - name: Build the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: pnpm tauri build --features release --config src-tauri/tauri.release.conf.json
      - name: Release files and the update manifest
        working-directory: apps/desktop
        env:
          COPILOT_RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
        run: node scripts/release.mjs manifest --version ${{ needs.plan.outputs.version }} --out ../../dist-release
      - name: Signed for Windows?
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist-release/Copilot-setup.exe
          "Authenticode: $($sig.Status) $($sig.SignerCertificate.Subject)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.plan.outputs.version }}
          path: dist-release
          if-no-files-found: error

  publish:
    name: publish to the releases bucket
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time, whether from a merge or a tag pushed by hand.
    concurrency:
      group: release-desktop-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation into the release account: no stored key
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      BUCKET: ${{ vars.GCP_RELEASES_BUCKET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::$SHA is not on main; tag a commit on main"; exit 1; }
      - name: The repository variables are set
        run: |
          [ -n "$BUCKET" ] && [ -n "${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}" ] ||
            { echo "::error::set GCP_RELEASES_BUCKET and GCP_RELEASE_SERVICE_ACCOUNT (terraform output ci)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ needs.plan.outputs.version }}
          path: dist-release
      - name: The manifest points at this bucket
        run: |
          url=$(jq -r '.platforms["windows-x86_64"].url' dist-release/latest.json)
          case "$url" in
            "https://storage.googleapis.com/$BUCKET/desktop/$VERSION/"*) echo "installer url: $url" ;;
            *) echo "::error::latest.json points at $url, not this bucket: run stage.py desktop-config"; exit 1 ;;
          esac
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - name: Never over a newer release
        run: |
          live=$(curl -fsS "https://storage.googleapis.com/$BUCKET/desktop/latest.json" | jq -r .version) || live=""
          if [ -n "$live" ] && uv run --no-project python scripts/desktop_release.py newer "$live" "$VERSION"; then
            echo "::error::the bucket already has $live, newer than $VERSION; tag a higher version"; exit 1
          fi
          echo "published now: ${live:-none}; publishing $VERSION"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Upload (the versioned installer, then the download link, then latest.json)
        run: |
          base="gs://$BUCKET/desktop"
          gcloud storage cp --cache-control="public, max-age=31536000, immutable"             "dist-release/$VERSION/"* "$base/$VERSION/"
          gcloud storage cp --cache-control="no-cache, max-age=0" dist-release/Copilot-setup.exe "$base/Copilot-setup.exe"
          gcloud storage cp --cache-control="no-cache, max-age=0" dist-release/latest.json "$base/latest.json"
      - name: Summary
        run: |
          {
            echo "### Copilot desktop $VERSION published"
            echo ""
            echo "- Download: https://storage.googleapis.com/$BUCKET/desktop/Copilot-setup.exe"
            echo "- Update manifest: https://storage.googleapis.com/$BUCKET/desktop/latest.json"
            echo "- Installed apps find it at their next check (at start, then every four hours) and install it when no call is running."
          } >> "$GITHUB_STEP_SUMMARY"

  # A release from a merge gets its tag once it is published, so the next plan counts from it.
  # (Pushed with GITHUB_TOKEN, the tag starts no other run.)
  tag:
    name: tag desktop-v${{ needs.plan.outputs.version }}
    needs: [plan, publish]
    if: needs.plan.outputs.create_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Push the tag
        env:
          TAG: desktop-v${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged \`$SHA\` as \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
