# Merge to main (ARCHITECTURE.md, "CI/CD" steps 2 to 4; README.md, "Deploy"): the same checks
# as on pull requests (ci.yml, called here), then the images, then the deploy of exactly those
# images. Nothing is built or deployed unless every check passes in this run. A merge that
# does not change the server (desktop app, docs or Terraform only; scripts/ci_changes.py,
# `server`) builds no image and deploys nothing; a manual run always does.
#
# Stage 0 on GCP (the gcp-* jobs): linux/amd64 images (the VM's) to Artifact Registry, tagged
# with the git SHA; then `stage.py deploy --tag <sha> --start --check` as the deploy service account: start
# the VM if it is stopped (and leave it running), migrations, each service in turn, a health
# check of the gateway and the API, and a rollback to the previous tag if that fails (the run
# then fails). Access is Workload Identity Federation only (no keys), the VM is reached over
# IAP with OS Login (no SSH port is open), and one deploy runs at a time.
#
# Then the desktop app (desktop-release): release-desktop.yml, called once the GCP deploy
# passed. It builds and publishes the next patch version only if the merge changed something
# the app ships since the last desktop-v* tag (README.md, "Releasing the desktop app").
#
# AWS (the images and deploy jobs; unused while the account's organization policy blocks it):
# ARM64 images to ECR, migrations as a one-off ECS task, then the services (deploy.py).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "A commit on main to check, build and deploy (e.g. to go back to it). Empty: the head of main."
        required: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STAGE: copilot-stage0

jobs:
  commit:
    name: commit to deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy.yml runs from main only (this run is on ${GITHUB_REF})"
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: sha
        name: The commit, which must be on main
        env:
          WANTED: ${{ inputs.sha || github.sha }}
        run: |
          sha=$(git rev-parse --verify "${WANTED}^{commit}") || { echo "::error::no commit ${WANTED}"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\`: $(git log -1 --format=%s "$sha")" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: checks
    needs: commit
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}
    # What ci.yml's jobs ask for (the Terraform job's OIDC and its PR comment, unused here).
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  # --- AWS (unused) ----------------------------------------------------------------------------

  images:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && needs.checks.outputs.server == 'true'
    needs: [commit, checks]
    name: image (${{ matrix.image }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { image: gateway, dockerfile: docker/python.Dockerfile, package: copilot-gateway, command: copilot-gateway }
          - { image: api, dockerfile: docker/python.Dockerfile, package: copilot-api, command: copilot-api }
          - { image: worker, dockerfile: docker/python.Dockerfile, package: copilot-worker, command: copilot-worker }
          - { image: proxy, dockerfile: docker/proxy/Dockerfile, package: "", command: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            PACKAGE=${{ matrix.package }}
            COMMAND=${{ matrix.command }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.STAGE }}/${{ matrix.image }}:${{ needs.commit.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [commit, images]
    runs-on: ubuntu-24.04
    # No `environment:` here: it would change the OIDC subject the deploy role trusts
    # (repo:<owner>/<repo>:ref:refs/heads/main).
    timeout-minutes: 30
    concurrency:
      group: deploy-stage0-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - name: Migrate and deploy
        run: >-
          uv run --no-project --with "boto3>=1.40" python infra/scripts/deploy.py
          --name "$STAGE" --region "$AWS_REGION" --tag "${{ needs.commit.outputs.sha }}"

  # --- Stage 0 on GCP (infra/gcp) -------------------------------------------------------------
  # Images through Workload Identity Federation as the push-only CI account, for linux/amd64
  # only (the e2-small VM; the AWS jobs above build their own ARM64 images), tagged with the git
  # SHA. Skipped until the repository variables from `terraform output ci` are set.

  gcp-images:
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && needs.checks.outputs.server == 'true'
    needs: [commit, checks]
    name: gcp image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        arch: [amd64]
        image: [gateway, api, worker, proxy]
        include:
          - { image: gateway, dockerfile: docker/python.Dockerfile, package: copilot-gateway, command: copilot-gateway }
          - { image: api, dockerfile: docker/python.Dockerfile, package: copilot-api, command: copilot-api }
          - { image: worker, dockerfile: docker/python.Dockerfile, package: copilot-worker, command: copilot-worker }
          - { image: proxy, dockerfile: docker/proxy/Dockerfile, package: "", command: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST || 'us-central1-docker.pkg.dev' }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            PACKAGE=${{ matrix.package }}
            COMMAND=${{ matrix.command }}
          tags: ${{ vars.GCP_REGISTRY }}/${{ matrix.image }}:${{ needs.commit.outputs.sha }}
          cache-from: type=gha,scope=gcp-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gcp-${{ matrix.image }}-${{ matrix.arch }}

  gcp-deploy:
    # Only from main, and only after the checks and the images of this run (needs). Skipped
    # until GCP_DEPLOY_SERVICE_ACCOUNT is set (terraform output ci).
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    needs: [commit, gcp-images]
    name: gcp deploy (Stage 0 VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deploy at a time: a newer merge waits for the running deploy, and a waiting one is
    # replaced by the next (GitHub keeps one pending run per group).
    concurrency:
      group: deploy-stage0-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
      - name: Deploy, health check, roll back on failure
        run: >-
          uv run --no-project python infra/gcp/scripts/stage.py deploy
          --tag "${{ needs.commit.outputs.sha }}" --start --check

  # --- The desktop app (release-desktop.yml) ---------------------------------------------------
  # After the backend is deployed and healthy, so a new app never meets an old backend; when
  # the merge did not change the server (no deploy), right after the checks. The plan job
  # inside decides release or skip; one release runs at a time (a newer waiting one replaces
  # an older, and its plan covers the older one's changes too).

  desktop-release:
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.checks.result == 'success' &&
      (needs.gcp-deploy.result == 'success' ||
       (needs.gcp-deploy.result == 'skipped' && needs.checks.outputs.server == 'false'))
    needs: [commit, checks, gcp-deploy]
    name: desktop
    concurrency:
      group: release-desktop
      cancel-in-progress: false
    permissions:
      contents: write # the desktop-v* tag
      id-token: write # the releases bucket, through Workload Identity Federation
    uses: ./.github/workflows/release-desktop.yml
    with:
      sha: ${{ needs.commit.outputs.sha }}
    secrets: inherit
