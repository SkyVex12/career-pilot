# Pull requests (ARCHITECTURE.md, "CI/CD" step 1): lint, type checks, tests against the local
# stack, protocol codegen and migration checks, and a Terraform plan for Stage 0 posted on the
# PR. Merging runs .github/workflows/deploy.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (lint, types, tests with the stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Postgres and Valkey run as service containers. ElasticMQ and the S3 store need a config
    # file and a command line, which service containers cannot take, so they start from
    # docker-compose.yml after the checkout: the same images and settings as locally.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d copilot" --health-interval 2s
          --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: ElasticMQ and the S3 store
        run: docker compose up -d --wait elasticmq s3
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Migrations and the local role logins
        run: uv run copilot-migrate && uv run copilot-dev-roles
      - name: Tests
        run: uv run pytest -q

  typescript:
    name: typescript (types, tests, codegen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Generated protocol types are current
        run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm test

  rust-linux:
    name: rust (protocol and client core, Linux)
    # The protocol crate and the client core (audio pipeline, VAD, AEC, framing, the gateway
    # and API clients, Cognito sign-in) have no Windows-only code, so their tests run on Linux,
    # which builds faster and costs a third of a Windows runner's minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # No debug info in CI builds: smaller caches, faster links. Local builds are unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (ALSA for cpal, D-Bus for keyring)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      # The client's integration tests start the real gateway code (copilot_gateway.offline).
      - run: uv sync --frozen
      - run: cargo fmt --all --check
      - run: cargo clippy -p copilot-protocol -p copilot-client --all-targets -- -D warnings
      # One invocation, so the dependencies build once. tests/api.rs needs the compose stack
      # and runs locally; the Python job covers the API itself.
      - name: Tests
        run: >-
          cargo test -p copilot-protocol -p copilot-client
          --lib --test contract --test pipeline --test gateway --test engine

  rust-windows:
    name: rust (desktop shell, Windows)
    # The Tauri shell (WASAPI capture devices, the Credential Manager, WebView2) is
    # Windows-only for now, so it is linted and tested here; the shared crates run on Linux.
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows
          cache-on-failure: true
      - run: cargo clippy -p copilot-desktop --all-targets -- -D warnings
      - run: cargo test -p copilot-desktop

  terraform:
    name: terraform (fmt, validate, plan for Stage 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub OIDC into the plan role: no stored AWS keys
      pull-requests: write # the plan as a PR comment
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_allowed_cidrs: ${{ vars.TF_ALLOWED_CIDRS || '[]' }}
    defaults:
      run:
        working-directory: infra/envs/stage0
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ../..
      - name: Validate
        run: terraform init -backend=false -input=false && terraform validate
      # Stage 0 on GCP (infra/gcp): validate both roots and lint the VM's control script. Its
      # plan is run by a person before an apply (README.md, "Deploying Stage 0").
      - name: Validate (GCP)
        working-directory: infra/gcp
        run: |
          for root in envs/stage0 bootstrap; do
            terraform -chdir=$root init -backend=false -input=false >/dev/null
            terraform -chdir=$root validate
          done
      - name: Shellcheck the VM's copilotctl
        working-directory: infra/gcp/host
        run: shellcheck -S warning copilotctl.sh
      # The plan needs the stage to exist (README.md, "Deploying Stage 0") and the repository
      # variables AWS_PLAN_ROLE_ARN and TF_STATE_BUCKET; until then it is skipped.
      - name: AWS credentials (plan role)
        if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan
        id: plan
        if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        run: |
          terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt > plan-short.txt
          [ "$code" -ne 1 ] || { cat plan.txt; exit 1; }
      - name: Post the plan
        if: steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/stage0/plan-short.txt', 'utf8');
            const changes = '${{ steps.plan.outputs.exitcode }}' === '2' ? 'changes' : 'no changes';
            const marker = '<!-- terraform-plan-stage0 -->';
            const body = `${marker}\n### Terraform plan, Stage 0 (${changes})\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\nApplying stays a manual step (README.md, "Deploying Stage 0").`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
