# Rust workspace: the desktop app, its client core, and the generated protocol types.
[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "packages/protocol/rust"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The audio pipeline (resampling, AEC, VAD) is too slow unoptimized to keep up in real time.
[profile.dev.package."*"]
opt-level = 3
