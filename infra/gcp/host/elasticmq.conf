# The jobs queue on the Stage 0 VM (ARCHITECTURE.md, "SQS job catalog"): ElasticMQ in place
# of SQS, with the same queues as docker/elasticmq/elasticmq.conf. It listens on 127.0.0.1
# only, and keeps every message in an H2 file on the data disk, so jobs survive restarts,
# deploys and a VM replacement.
include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "127.0.0.1"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

aws {
  region = us-east-1
  accountId = 000000000000
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}

queues {
  jobs {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue {
      name = "jobs-dlq"
      maxReceiveCount = 5
    }
  }
  jobs-dlq {}
}
