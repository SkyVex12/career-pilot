# Stage 0 edge proxy (ARCHITECTURE.md, "Stage 0 settings"): one host name, plain
# HTTP on port 80 behind an IP allow-list, path routing to the services on the same instance.
#   /v1/session  WebSocket to the gateway (127.0.0.1:8081)
#   /healthz     the proxy itself
#   everything   else to the API (127.0.0.1:8080)
# Stage 0 has no TLS; TLS (CloudFront or a real domain) is required before anyone outside the
# team uses it.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # JSON lines to CloudWatch. No headers (the bearer token lives in Authorization) and no
    # query strings (the API takes none that matter); the path holds ids only.
    log_format json escape=json '{"ts":"$time_iso8601","service":"proxy","remote":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$bytes_sent,'
        '"ms":"$request_time","upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway {
        server 127.0.0.1:8081;
        keepalive 4;
    }

    upstream api {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        # API bodies are JSON; documents and audio go straight to S3 through presigned URLs.
        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"proxy"}';
        }

        location = /v1/session {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # The ALB's idle timeout in the design: the client pings every 30 s, and the
            # gateway closes a socket silent for 90 s.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
