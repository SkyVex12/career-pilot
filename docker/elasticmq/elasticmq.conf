# Queues for the local stack; mirrors the `jobs` queue in ARCHITECTURE.md ("SQS job catalog").
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  jobs {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue {
      name = "jobs-dlq"
      maxReceiveCount = 5
    }
  }
  jobs-dlq {}
}
