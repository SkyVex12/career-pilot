[package]
name = "copilot-desktop"
version = "0.0.0"
description = "Copilot desktop client"
edition = "2024"
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
copilot-client = { path = "../core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: a transparent overlay window needs it on macOS (a no-op elsewhere), so the
# opacity setting can make the overlay see-through.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
# Native message dialog for the "update available" prompt at launch (release.rs).
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# One running app per computer: a second launch focuses the first (lib.rs, run).
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }
# Coding mode's shots (shots.rs): shrink and encode them as lossless WebP. Pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"

# The main window's microphone permission for guest seats' voice (voice.rs): the versions
# Tauri's own WebView2 (wry) uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# HWND for moving the WebView while stealth mode sets capture exclusion on Windows 11 21H2
# (stealth.rs); the monitors and SendInput for guest seats' remote input (remote.rs). The
# version webview2-com itself uses.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Coding mode's shots: the window in front through PrintWindow (PW_RENDERFULLCONTENT), or the
# monitor under the cursor (GDI). Windows only: on Linux it pulls in PipeWire and Wayland.
xcap = "0.9.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSError"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
xcap = "0.9.10"

[features]
# Native cloud testing uses the deployed URLs and sign-in without replacing a local build
# through the updater. `pnpm build:cloud` embeds the frontend as well.
cloud = []
# Release builds (the installer teammates use): the stage's URLs from apps/desktop/release.json
# (or COPILOT_RELEASE_CONFIG), no local environment or dev token, and the updater.
# `pnpm tauri build --features release --config src-tauri/tauri.release.conf.json`
# (apps/desktop/scripts/release.mjs writes that file).
release = ["cloud", "dep:tauri-plugin-updater"]
