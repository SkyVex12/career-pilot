[package]
name = "copilot-desktop"
version = "0.0.0"
description = "Copilot desktop client"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
copilot-client = { path = "../core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: a transparent overlay window needs it on macOS (a no-op elsewhere), so the
# opacity setting can make the overlay see-through.
tauri = { version = "2", features = ["macos-private-api"] }
# Native message dialog for the "update available" prompt at launch (release.rs).
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[features]
# Release builds (the installer teammates use): the stage's URLs from apps/desktop/release.json
# (or COPILOT_RELEASE_CONFIG), no local environment or dev token, and the updater.
# `pnpm tauri build --features release --config src-tauri/tauri.release.conf.json`
# (apps/desktop/scripts/release.mjs writes that file).
release = ["dep:tauri-plugin-updater"]
