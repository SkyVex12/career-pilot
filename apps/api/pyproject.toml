[project]
name = "copilot-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copilot-core",
  "copilot-protocol",
  "tzdata>=2025.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
copilot-api = "copilot_api.main:run"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
