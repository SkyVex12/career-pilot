[project]
name = "copilot-gateway"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copilot-core",
  "copilot-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
copilot-gateway = "copilot_gateway.main:run"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
