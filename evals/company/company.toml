[[document]]
name = "checkout-platform-architecture.md"
text = """
# Checkout Platform: architecture notes

Owner: Checkout Platform team (engineering manager: Priya Raman).

## Services
- **Checkout API**: Python (FastAPI) on ECS Fargate behind an ALB. Owns the cart, pricing and the checkout flow. Calls the payments adapter over gRPC.
- **Payments adapter** ("the adapter"): Go service on ECS that talks to the PSPs (Stripe as primary, Adyen as backup). One connection pool per PSP, capped at 200 connections. Stores refund and capture records in its own Postgres.
- **Order pipeline**: Go consumers on Kafka (MSK). Turns checkout events into orders and feeds the ledger.
- **Reservation service**: Go on ECS. Holds inventory for a cart during checkout and sends reservation events to an SQS FIFO queue for the warehouse system.
- **Fraud scoring client**: a Python library the Checkout API calls; owned by Sam Okafor. Times out after 800 ms and fails open.

## Data and messaging
- Postgres (RDS) per service; no shared databases.
- Kafka topics: checkout-events, orders, ledger-feed.
- SQS FIFO: reservations.fifo. Messages that fail 5 receives go to reservations-dlq; Dana's team replays the DLQ with the `dlq-replay` tool after a fix, and checks it every Monday.

## Operations
- On-call: one engineer per week; Dana Whitfield (SRE) owns the platform side.
- Dashboards in Grafana; alerts page at checkout p95 above 600 ms for 10 minutes.
"""

[[document]]
name = "2026-10-14-reservation-sync-notes.md"
text = """
# Reservation sync, 2026-10-14

Attendees: Priya Raman (EM), Marco Silva (PM), Dana Whitfield (SRE), Alex Rivera.

## Problem
The reservation service writes the reservation to Postgres and then sends to SQS. A crash between the two loses the event; the warehouse never sees the hold.

## Options
1. Move reservations to Kafka. Rejected for now: a second MSK cluster or new topics on the order cluster add cost and on-call load, and the team knows SQS well.
2. Keep SQS FIFO and add a transactional outbox: the event is written in the same transaction as the reservation; a relay publishes it.

## Decision
Keep SQS FIFO and build the outbox (option 2). SQS FIFO's 5-minute deduplication window plus idempotent warehouse consumers is enough. Revisit Kafka in Q1 if reservations pass 2,000 messages a second.

## Action items
- Alex: outbox design and rollout plan for Marco by 2026-10-23.
- Dana: staging access for the relay.
- Marco: tell the warehouse team about the duplicate-tolerant consumer requirement.
"""

[[document]]
name = "checkout-glossary.md"
text = """
# Checkout glossary

- **PSP**: payment service provider (Stripe, Adyen).
- **Reservation hold**: the inventory a cart holds during checkout; it expires after 15 minutes without payment.
- **Auth-capture gap**: the time between authorizing a card and capturing the payment; ours is up to 7 days for back-ordered items.
- **Ledger feed**: the Kafka topic finance reads orders from; it must not see duplicates.
- **The adapter**: the payments adapter service.
"""
