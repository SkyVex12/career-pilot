# Standup and meeting questions for the company-workspace eval (evals/README.md, "Company
# workspaces"). The company and its material are in company.toml; "today" is its `today`.
#
# Fields per question:
#   id, question, type  as in evals/answers/questions.toml (type: the detector's type)
#   mode                standup or meeting
#   key_points          what a complete, correct answer covers (from the logs, the documents
#                       and general knowledge); the grader checks completeness against them
#   trap                what the answer must not claim (facts the material does not hold)
#
# Meeting questions share one meeting: its title and agenda are [meeting].

[meeting]
title = "Reservation outbox design review"
agenda = "Rollout and backfill of the reservation outbox; how we keep duplicates out of the warehouse and the ledger feed."
transcript = """[00:01] Them: Okay, let's get started. Thanks for joining, everyone.
[00:05] Them: Alex, you've been driving the outbox work, so most questions will go to you.
[00:12] (Alex Rivera spoke for 20 s)"""

[standup]
transcript = """[00:01] Them: Morning all. Let's go around. Priya, you first.
[00:05] Them: Thanks Priya. Alex?"""

# --- Standup ---------------------------------------------------------------------------------

