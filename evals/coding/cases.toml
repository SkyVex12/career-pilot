# Coding-mode eval cases (copilot-coding-eval). Each case is 1 to 3 shots of an original page
# in pages/, rendered to shots/ at 1568 x 882 (`render`); `offset` scrolls the page down that
# many pixels first, as a second shot of a long page would be.
#
# kinds: the tasks the screen holds, in screen order. Each [[case.task]] checks one of them
# (`n`, from 1):
#   choice = the correct option letters
#   output = the exact output
#   keywords = words a short answer must contain (any one of each group, "a|b")
#   function + language + tests = the code is run on these cases: [args as JSON, expected as JSON]
#   sql = rows the query must return on sql_setup (SQLite; PostgreSQL casts are dropped)
# modes: the answer modes to run it in (default both). transcript: the call so far, used in the
# interview mode only.

default_transcript = """Them: Okay, I've pasted the problem in the shared editor. Take a minute to read it.
Them: When you're ready, walk me through how you'd approach it before you code."""

[[case]]
id = "code_py"
shots = [{ page = "code_py", title = "1834. Merge Booking Windows - CodeTrial - Google Chrome" }]
kinds = ["code"]

[[case.task]]
n = 1
function = "mergeWindows"
language = "python"
tests = [
  ['[[[1,3],[2,6],[8,10],[15,18]]]', '[[1,6],[8,10],[15,18]]'],
  ['[[[1,4],[4,5]]]', '[[1,5]]'],
  ['[[[6,8],[1,2],[2,3]]]', '[[1,3],[6,8]]'],
  ['[[[1,10],[2,3],[4,5]]]', '[[1,10]]'],
]

