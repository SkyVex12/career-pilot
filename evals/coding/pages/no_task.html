<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .icons { position: absolute; top: 24px; left: 24px; display: grid; gap: 28px; color: #fff; font-size: 12px; text-align: center; }
  .icons div::before { content: ""; display: block; width: 44px; height: 44px; margin: 0 auto 6px; background: rgba(255,255,255,.25); border-radius: 8px; }
  .taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: rgba(20,20,30,.85); }
</style></head>
<body>
<!-- A desktop with no task on it: the answer must say so, not invent a problem. -->
<div class="desk"></div>
<div class="icons"><div>Recycle Bin</div><div>Documents</div><div>Notes</div></div>
<div class="taskbar"></div>
</body></html>
