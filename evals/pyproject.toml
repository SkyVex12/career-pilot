[project]
name = "copilot-evals"
version = "0.0.0"
description = "Eval runners: replay recorded calls through the gateway and measure latency"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copilot-protocol",
  "numpy>=2.5.3",
  "pysilero-vad>=3.4.0",
  "soxr>=1.1.0",
  "websockets>=14",
]

[project.scripts]
copilot-replay = "copilot_evals.replay:run"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
