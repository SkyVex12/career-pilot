# Fictional candidate for the latency benchmark: the hot digest and interview session pack the
# benchmark writes to Valkey for its own user id (never the dev user's). Nothing here is a real
# person. Prepared answers are embedded with the gateway's embedding model when seeded.

user_name = "Alex Rivera"
company = "Northwind Payments"
role_title = "Senior Backend Engineer"
round = "technical"
job_summary = "Payments platform team moving batch settlement jobs to streaming; Go and Python services on AWS, PostgreSQL and Kafka."

digest = """
# Career digest (version 2026-10-12)
## Roles
[n:a1] Senior Backend Engineer, Larkspur Commerce, 2022 to now. Team: Checkout Platform, 9 engineers. Owns the order pipeline and the payments adapter layer.
[n:a2] Backend Engineer, Tidewater Logistics, 2018 to 2022. Built shipment tracking APIs and the event ingestion service.
[n:a3] Software Engineer intern, Brightfield Labs, summer 2017. Data tooling in Python.
## Top stories
[n:s1] Checkout outage on Black Friday: the payments adapter exhausted its connection pool at 6x normal traffic; led the incident, shed load with a feature flag in 12 minutes, then added pool limits per provider and load tests in CI. Revenue loss held under 0.3% of the day. Competencies: ownership, calm under pressure, incident response.
[n:s2] Order pipeline to Kafka: replaced nightly batch reconciliation with a streaming pipeline (Kafka, Go consumers, PostgreSQL); reconciliation lag went from 24 hours to under 2 minutes; ran old and new side by side for 6 weeks before cutover. Competencies: technical depth, migration planning.
[n:s3] Schema evolution: introduced a schema registry with backward-compatible Avro schemas and a CI check that blocks breaking changes; zero consumer breakages in 18 months after 140 schema changes. Competencies: technical depth, reliability.
[n:s4] Disagreed with manager on a rewrite: manager wanted to rewrite the tracking service in a new language; proposed a two-week spike with measurable criteria instead; the spike showed the bottleneck was the database, fixed with two indexes and a cache, p95 down 70%; manager agreed and the rewrite was dropped. Competencies: influence, data-driven decisions.
[n:s5] Mentoring: mentored three junior engineers through their first on-call rotations; wrote the team's incident runbook template, now used by four teams. Competencies: leadership, mentoring.
[n:s6] Rate limiting for partner APIs at Tidewater: token bucket per API key in Redis with a Lua script, local in-process buckets as a fallback during Redis failover; handled 15k requests per second. Competencies: system design, reliability.
[n:s7] Cost cut: rightsized the event ingestion cluster and moved cold data to S3 with lifecycle rules; saved 38% of the team's AWS bill. Competencies: ownership, cost awareness.
[n:s8] Failed launch: shipped a shipment-ETA feature without enough real-world validation; predictions were off by hours for rural routes; rolled back, added a shadow mode and per-region accuracy dashboards, relaunched 5 weeks later at 92% within 30 minutes. Competencies: learning from failure, accountability.
## Skills
Go (5 y), Python (8 y), PostgreSQL (7 y), Kafka (4 y), AWS (6 y: ECS, RDS, S3, SQS), Redis (5 y), Terraform (3 y), gRPC, OpenTelemetry
## Education
B.S. Computer Science, State University, 2018
## Preferences and goals
Looking for a larger-scale payments or fintech platform role with more system design ownership; current team's roadmap is shifting to frontend work.
"""

