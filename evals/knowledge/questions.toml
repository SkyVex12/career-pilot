# Technical questions for the engineering-context eval (copilot-knowledge-eval, evals/README.md).
#
# The 35 technical turns of docs/analysis/2026-11-14-standup-technical.md, one question each
# and in the same order, moved to a fictional company: Alex Rivera (bench/profile.toml) builds
# reports at Fernhill Logistics; the documents in docs/ are invented for this eval. Every line
# is invented wording: nothing here is a real person's words or a real company's design. Two
# more questions at the end ask for what no document holds.
#
# Per question:
#   turn      the analysis's turn number it stands for
#   context   the call's lines before it, oldest first: ["them" | "me", text]
#   text      what the other side says: the turn the user must answer
#   types     the detector types that give the right answer shape (any of them counts)
#   source    where the fact is: a file in docs/, "work log" ([[item]] below), "general"
#             (the model's own knowledge), "opinion" (nothing to ground it) or "none"
#   fact      a pattern the prompt must contain for the fact to count as retrieved
#   must      patterns a correct answer contains (all of them); must_not: none of them
# For source = "none" a correct answer says the user will confirm and follows up, and gives
# no made-up specific (must_not).

